[package]
name = "pexliformation"
version = "1.0.0"
description = "Offline Rust smart contract to SBF converter for the Pexli v2 blockchain"
authors = ["PexliFormation"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pexliformation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
which = "6"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
