name: Build Windows installer

# Builds a fully self-contained PexliFormation installer: the SBF toolchain
# (cargo-build-sbf + platform-tools) and a seed crate cache are bundled inside
# the app, so the installed program needs nothing else and touches nothing on
# the user's system.
#
# On every push/PR: build (+ standalone verify), upload the installer artifact.
# On a manual "Run workflow" or a v* tag: also publish the GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (to compile the app)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SBF toolchain (Agave)
        shell: pwsh
        run: |
          $u = "https://release.anza.xyz/stable/agave-install-init-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\agave-install-init.exe"
          & "$env:TEMP\agave-install-init.exe" stable
          "$env:USERPROFILE\.local\share\solana\install\active_release\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Warm up platform-tools and seed the crate cache
        shell: pwsh
        run: |
          # Build the example once with an isolated CARGO_HOME. This downloads
          # platform-tools (the SBF compiler) and fills a seed crate cache that
          # we bundle so common contracts build offline.
          $seed = "$env:GITHUB_WORKSPACE\seed-cargo"
          $env:CARGO_HOME = $seed
          $proj = "$env:TEMP\seed_proj"
          New-Item -ItemType Directory -Force -Path "$proj\src" | Out-Null
          Copy-Item examples\hello_pexli.rs "$proj\src\lib.rs"
          @"
          [package]
          name = "hello_pexli"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib", "lib"]

          [dependencies]
          solana-program = "1.18"
          "@ | Out-File -Encoding utf8 "$proj\Cargo.toml"
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path "$proj\Cargo.toml"

      - name: Bundle the toolchain + crate seed into the app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $res  = "$env:GITHUB_WORKSPACE\src-tauri\resources"
          $pt   = "$res\platform-tools"
          $seed = "$res\cargo-seed"
          New-Item -ItemType Directory -Force -Path $pt, "$seed\registry" | Out-Null

          # The Agave active_release (bin\cargo-build-sbf.exe + bin\sdk\...).
          $src = "$env:USERPROFILE\.local\share\solana\install\active_release"
          Copy-Item "$src\*" $pt -Recurse -Force

          # The SBF platform-tools (rust incl. host cargo, + llvm) may live under
          # the SDK, or in a cache dir. Make sure the bundle has it at the path
          # cargo-build-sbf expects: bin\sdk\sbf\dependencies\platform-tools.
          $depPT = "$pt\bin\sdk\sbf\dependencies\platform-tools"
          if (-not (Test-Path "$depPT\rust\bin\cargo.exe")) {
            Write-Host "Locating platform-tools (with host cargo) in caches..."
            $found = $null
            foreach ($r in @("$env:USERPROFILE\.local\share\solana", "$env:USERPROFILE\.cache\solana")) {
              if (Test-Path $r) {
                $c = Get-ChildItem $r -Recurse -Filter cargo.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'platform-tools\\rust\\bin\\cargo\.exe$' } |
                     Select-Object -First 1
                if ($c) { $found = $c; break }
              }
            }
            if (-not $found) {
              Write-Host "No platform-tools cargo found. All cargo.exe under solana dirs:"
              foreach ($r in @("$env:USERPROFILE\.local\share\solana", "$env:USERPROFILE\.cache\solana")) {
                if (Test-Path $r) { Get-ChildItem $r -Recurse -Filter cargo.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName } }
              }
              Write-Error "Could not locate platform-tools host cargo"; exit 1
            }
            $ptSrc = Split-Path (Split-Path (Split-Path $found.FullName))  # ...\platform-tools
            New-Item -ItemType Directory -Force -Path (Split-Path $depPT) | Out-Null
            Copy-Item $ptSrc (Split-Path $depPT) -Recurse -Force
            Write-Host "Copied platform-tools from $ptSrc"
          }
          if (-not (Test-Path "$depPT\rust\bin\cargo.exe")) {
            Write-Error "Bundle still missing host cargo at $depPT\rust\bin\cargo.exe"; exit 1
          }
          Write-Host "OK host cargo bundled: $depPT\rust\bin\cargo.exe"

          # cargo-build-sbf drives the build through rustup, so bundle the rustup
          # proxies (cargo/rustc) and rustup.exe from ~/.cargo/bin.
          $tc = "$res\toolchain\cargo-bin"
          New-Item -ItemType Directory -Force -Path $tc | Out-Null
          Copy-Item "$env:USERPROFILE\.cargo\bin\*" $tc -Recurse -Force
          foreach ($x in @("rustup.exe", "cargo.exe", "rustc.exe")) {
            if (-not (Test-Path "$tc\$x")) { Write-Error "Bundle missing $x"; exit 1 }
          }
          Write-Host "OK rustup + proxies bundled in $tc"

          # Seed only the compressed cache + index; sources extract at runtime.
          Copy-Item "$env:GITHUB_WORKSPACE\seed-cargo\registry\cache" "$seed\registry\cache" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\seed-cargo\registry\index" "$seed\registry\index" -Recurse -Force

          Write-Host "Bundled toolchain size:"
          "{0:N0} MB" -f ((Get-ChildItem $pt -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "Bundled seed size:"
          "{0:N0} MB" -f ((Get-ChildItem $seed -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Verify the BUNDLED toolchain works standalone (fresh-machine sim)
        shell: pwsh
        run: |
          # Simulate a user's machine: only the bundled files, private RUSTUP_HOME
          # and CARGO_HOME, no system Agave, offline. Prove Rust->SBF works.
          $res    = "$env:GITHUB_WORKSPACE\src-tauri\resources"
          $ptBin  = "$res\platform-tools\bin"
          $cbs    = "$ptBin\cargo-build-sbf.exe"
          $cargoBin = "$res\toolchain\cargo-bin"
          $ptRust = "$res\platform-tools\bin\sdk\sbf\dependencies\platform-tools\rust"

          $RUSTUP = "$env:TEMP\iso-rustup"
          $CARGO  = "$env:TEMP\iso-cargo"
          New-Item -ItemType Directory -Force -Path $RUSTUP, "$CARGO\registry" | Out-Null
          Copy-Item "$res\cargo-seed\registry\*" "$CARGO\registry" -Recurse -Force

          $env:RUSTUP_HOME      = $RUSTUP
          $env:CARGO_HOME       = $CARGO
          $env:RUSTUP_TOOLCHAIN = "solana"
          $env:CARGO_NET_OFFLINE = "true"
          # Minimal PATH: bundled rustup proxies + platform-tools bin only.
          $env:PATH = "$cargoBin;$ptBin;$env:SystemRoot\System32;$env:SystemRoot"

          # Register the bundled platform-tools rust as the 'solana' toolchain
          # in our private RUSTUP_HOME (never touches the user's ~/.rustup).
          & "$cargoBin\rustup.exe" toolchain link solana $ptRust
          & "$cargoBin\rustup.exe" toolchain list

          $proj = "$env:TEMP\verify_proj"
          New-Item -ItemType Directory -Force -Path "$proj\src" | Out-Null
          Copy-Item examples\hello_pexli.rs "$proj\src\lib.rs"
          @"
          [package]
          name = "hello_pexli"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib", "lib"]

          [dependencies]
          solana-program = "1.18"
          "@ | Out-File -Encoding utf8 "$proj\Cargo.toml"

          & $cbs --manifest-path "$proj\Cargo.toml"
          $so = "$proj\target\deploy\hello_pexli.so"
          if (Test-Path $so) {
            $f = Get-Item $so
            Write-Host ("STANDALONE OK — {0} ({1:N0} bytes)" -f $f.Name, $f.Length)
          } else {
            Write-Error "Bundled toolchain failed to produce a .so"; exit 1
          }

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app (bundled NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PexliFormation-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish Release (version tag, or manual "Run workflow")
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: PexliFormation ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          body: |
            **PexliFormation — offline Rust → SBF converter for Pexli v2.**

            Fully self-contained: the SBF toolchain is bundled inside the app.
            Download the `.exe`, install, open, pick a Rust contract, click
            Convert. No terminal, nothing else to install, works offline. A clean
            uninstall removes everything.
          files: src-tauri/target/release/bundle/nsis/*.exe
