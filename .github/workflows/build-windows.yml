name: Build Windows installer

# Two jobs on real Windows:
#   build      — produces the one-click PexliFormation installer (.exe + .msi).
#   sbf-test   — proves the core Rust→SBF conversion actually works by running
#                the exact flow the app uses on examples/hello_pexli.rs.
#
# On every push/PR: builds + tests, uploads the installer as an artifact.
# On a version tag (v*): also attaches the installers to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the tag build can create a Release and upload the installers.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app (NSIS + MSI)
        run: npm run build:win

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PexliFormation-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish Release (version tag, or manual "Run workflow")
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag build use the tag; on a manual run create/refresh v1.0.0.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: PexliFormation ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          body: |
            **PexliFormation — offline Rust → SBF converter for Pexli v2.**

            One-click Windows installer. Download the `.exe`, install, open, and
            convert a Rust contract to an SBF `.so` — no terminal, works offline.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Proof that the Rust -> SBF conversion works end to end.
  sbf-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SBF toolchain (Agave / cargo-build-sbf)
        shell: pwsh
        run: |
          $u = "https://release.anza.xyz/stable/agave-install-init-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\agave-install-init.exe"
          # The init binary needs the release channel/version as an argument.
          & "$env:TEMP\agave-install-init.exe" stable
          "$env:USERPROFILE\.local\share\solana\install\active_release\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Convert examples/hello_pexli.rs -> SBF (same flow as the app)
        shell: pwsh
        run: |
          $proj = "$env:TEMP\pexli_test"
          New-Item -ItemType Directory -Force -Path "$proj\src" | Out-Null
          Copy-Item examples\hello_pexli.rs "$proj\src\lib.rs"
          @"
          [package]
          name = "hello_pexli"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib", "lib"]

          [dependencies]
          solana-program = "1.18"
          "@ | Out-File -Encoding utf8 "$proj\Cargo.toml"

          Write-Host "cargo-build-sbf --version:"
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path "$proj\Cargo.toml"

          $so = "$proj\target\deploy\hello_pexli.so"
          if (Test-Path $so) {
            $f = Get-Item $so
            Write-Host "SUCCESS — SBF program produced:" -ForegroundColor Green
            Write-Host ("  {0}  ({1:N0} bytes)" -f $f.Name, $f.Length)
            $hash = (Get-FileHash $so -Algorithm SHA256).Hash
            Write-Host "  SHA-256: $hash"
          } else {
            Write-Error "FAIL — no .so (SBF program) was produced"
            exit 1
          }
